name: Family task BDD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bdd:
    name: Authenticated household scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify Docker is available for Reboot Envoy
        run: docker version

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate Reboot API bindings
        run: uv run rbt generate

      - name: Install Chromium for browser BDD
        run: uv run playwright install --with-deps chromium

      - name: Run browser-backed OAuth BDD scenario
        run: timeout 10m uv run pytest -vv -s tests/family_task_management_web_test.py

      - name: Run authenticated household domain BDD scenario
        run: timeout 10m uv run pytest -vv -s tests/family_task_management_test.py

      - name: Capture Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          for id in $(docker ps -aq --filter ancestor=envoyproxy/envoy:v1.38.4); do
            echo "=== Envoy $id ==="
            docker logs "$id" || true
          done

[package]
name = "family-tasks"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Draft Rust rewrite for Family Tasks on a future Reboot Rust SDK"

# `reboot` is intentionally hypothetical. Everything else is a normal Rust
# dependency selected to show the desired application-facing DX.
[dependencies]
reboot = { version = "0.1", features = ["mcp", "oauth", "ordered-map"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
